version: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=devpassword
      - REDIS_URL=redis://:devpassword@redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:alpine
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"
